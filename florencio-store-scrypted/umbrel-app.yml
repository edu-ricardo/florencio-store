tagline: Camera hub for HomeKit, Google Home and Alexa with smart detection
icon: https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-scrypted/icon.png
description: >-
  Scrypted is a high performance video integration and automation platform.
  Bring cameras from almost any brand (ONVIF, RTSP, Hikvision, Reolink, Amcrest,
  Unifi, Ring, Nest, Wyze) into Apple HomeKit Secure Video, Google Home and
  Alexa, with low-latency streaming, rebroadcast and smart motion and object
  detection. Scrypted NVR is available as an optional paid plugin.


  On first access you will be asked to create the admin account.


  Updates are delivered through the Umbrel App Store; the in-app updater is not used.
