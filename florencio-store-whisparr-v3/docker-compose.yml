version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-whisparr-v3_server_1
      APP_PORT: 6969
      # Libera a API para o Prowlarr e outras integrações
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    # Imagem hotio, tag "v3" = Whisparr v3 (Eros)
    image: ghcr.io/hotio/whisparr:v3-3.1.0.2116@sha256:e522eec938fb0d0980d90b28304c3ef768b81ad95874092be26d8d764f1180e8
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: "002"
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Mesmo caminho /downloads usado pelo Transmission/qBittorrent do Umbrel
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
