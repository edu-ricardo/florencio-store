version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-chaptarr_server_1
      APP_PORT: 8789
      # Libera a API para o Prowlarr e outras integrações
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: chaptarr/chaptarr:0.9.965@sha256:bb00d67cbe1485d1cd61ef178362a29b42aa08f86b290841aab4b115ad2647a6
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Mesmo caminho /downloads usado pelo Transmission/qBittorrent do Umbrel
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
