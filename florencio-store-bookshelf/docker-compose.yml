version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-bookshelf_server_1
      APP_PORT: 8787
      # Libera a API para o Prowlarr e outras integrações
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    # Tag "hardcover": metadados do Hardcover (melhores que os do Goodreads)
    image: ghcr.io/pennydreadful/bookshelf:hardcover-v0.4.21.182@sha256:67498dd5ece516867d72ee642abd6c1a66b36a135c8f7da0127109564372beb1
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Mesmo caminho /downloads usado pelo Transmission/qBittorrent do Umbrel
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
