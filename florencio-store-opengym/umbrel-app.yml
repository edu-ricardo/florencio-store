manifestVersion: 1
id: florencio-store-opengym
category: files
name: openGym
version: "1.3.10-coach"
tagline: Self-hosted gym and body-weight tracker
icon: https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-opengym/icon.png
description: >-
  openGym is a self-hosted gym and body-weight tracker. Plan your week over a
  library of 1,300+ exercises with animated demos, run guided workouts
  (supersets, warm-ups and cardio included), log every set, see which muscles
  are trained or fatigued, and chart your body weight over time. Imports from
  FitNotes, Strong and Hevy. Installable on your phone as a home-screen app.


  Sign-in: this install enables name + password sign-in, so profiles work on
  http://umbrel.local. Passkeys need HTTPS: to use them, expose openGym over
  HTTPS (Tailscale or Cloudflare Tunnel) and set RP_ID and ORIGIN in
  app-data/florencio-store-opengym/data/opengym.env.


  AI Coach: this build includes the Claude Agent SDK and Codex CLI runtimes.
  Enable it in Settings > Admin > AI Coach, pick "Claude (Anthropic)" and paste
  a token from `claude setup-token` (or use an API key from any provider).


  The first start downloads ~140 MB of exercise images and animations.
developer: Duarte Santos
website: https://github.com/DuarteSantos8/openGym
submitter: edu-ricardo
submission: https://github.com/edu-ricardo/florencio-store
repo: https://github.com/DuarteSantos8/openGym
support: https://github.com/DuarteSantos8/openGym/issues
port: 8792
gallery:
  - https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-opengym/home.png
  - https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-opengym/workout.png
  - https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-opengym/plan.png
  - https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-opengym/stats.png
releaseNotes: >-
  openGym 1.3.9: edit saved workouts (date, duration, photos and videos),
  password sign-in (enabled here, so profiles work over http://umbrel.local),
  more than one passkey per profile, photos/videos on custom exercises,
  Structural Balance, plate loading per set and paired-phone sync fixes.
  Also fixes the text encoding of the app's compose file.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
