version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-opengym_web_1
      APP_PORT: 80
      # O openGym tem login próprio (passkey ou senha)
      PROXY_AUTH_ADD: "false"

  # Baixa uma única vez as imagens/GIFs dos exercícios (~140 MB)
  media:
    image: alpine/git:v2.54.1@sha256:2306e2b05ee0ef99f5d25b0779f645b24ae9f91ba187107503592fcdfe78da3a
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/media/img:/out/img
      - ${APP_DATA_DIR}/data/media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls /out/img/*.jpg 2>/dev/null)" ]; then
          echo "Downloading exercise media (~140 MB, one time)..."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          chown -R 1000:1000 /out/img /out/gif
        else
          echo "Exercise media already present - skipping download."
        fi

  api:
    # Alvo "coach" (Claude Agent SDK + Codex CLI), compilado do código oficial pelo
    # workflow .github/workflows/opengym-coach-image.yml deste repositório
    image: ghcr.io/edu-ricardo/opengym-api-coach:1.4.5@sha256:7a3347150eb84aeb73c0a14af3fa36367d8269ddc964fe2c75fde713c74c6a8e
    restart: on-failure
    # RP_ID / ORIGIN e opções ficam neste arquivo (editável pelo usuário)
    env_file:
      - ${APP_DATA_DIR}/data/opengym.env
    environment:
      PORT: 3000
      DATA_DIR: /data
      TZ: America/Sao_Paulo
      # Login com nome + senha: passkeys não funcionam em http://umbrel.local
      PASSWORD_LOGIN: "1"
      # Tela de login e perfis novos em português (cada um pode trocar em Settings)
      DEFAULT_LANG: pt-BR
      # A API só é acessível pelo container web, que reescreve X-Forwarded-For
      TRUST_PROXY: "1"
    volumes:
      - ${APP_DATA_DIR}/data/api:/data

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.5@sha256:e621677554302a0e1745e3b8c90acddc7d7149e118c4d683d51c13aa88f47d27
    restart: on-failure
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      NGINX_PORT: 80
      # Nome completo do container: a rede do Umbrel é compartilhada entre apps,
      # e só "api" poderia apontar para o serviço de outro app.
      BACKEND: florencio-store-opengym_api_1
      PORT: 3000
      RESOLVER: 127.0.0.11
      # Tamanho máximo de fotos/vídeos dos exercícios e treinos
      MEDIA_UPLOAD_MAX: 48m
    volumes:
      - ${APP_DATA_DIR}/data/media/img:/usr/share/nginx/html/img:ro
      - ${APP_DATA_DIR}/data/media/gif:/usr/share/nginx/html/gif:ro
