version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-opengym_web_1
      APP_PORT: 80
      # O openGym tem login próprio (passkeys)
      PROXY_AUTH_ADD: "false"

  # Baixa uma única vez as imagens/GIFs dos exercícios (~140 MB)
  media:
    image: alpine/git:v2.54.0@sha256:ae0f6f4bce38d2b8c40becc0d6241a08d9f57186ea03029de2189a2b5e722d94
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/media/img:/out/img
      - ${APP_DATA_DIR}/data/media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls /out/img/*.jpg 2>/dev/null)" ]; then
          echo "Downloading exercise media (~140 MB, one time)..."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          chown -R 1000:1000 /out/img /out/gif
        else
          echo "Exercise media already present - skipping download."
        fi

  api:
    # Alvo "coach" (Claude Agent SDK + Codex CLI), compilado do código oficial pelo
    # workflow .github/workflows/opengym-coach-image.yml deste repositório
    image: ghcr.io/edu-ricardo/opengym-api-coach:1.3.8@sha256:918990106519347716fa640ef584b07c26efef2a0e79a8cf8794da12ab70b6fd
    restart: on-failure
    # RP_ID / ORIGIN e opções ficam neste arquivo (editável pelo usuário)
    env_file:
      - ${APP_DATA_DIR}/data/opengym.env
    environment:
      PORT: 3000
      DATA_DIR: /data
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/api:/data

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.3.8@sha256:2beebe4011f35efe249f12c20c1a2d53d389b4acb917011525ec7e4311235638
    restart: on-failure
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      NGINX_PORT: 80
      # Nome completo do container: a rede do Umbrel é compartilhada entre apps,
      # e só "api" poderia apontar para o serviço de outro app.
      BACKEND: florencio-store-opengym_api_1
      PORT: 3000
      RESOLVER: 127.0.0.11
    volumes:
      - ${APP_DATA_DIR}/data/media/img:/usr/share/nginx/html/img:ro
      - ${APP_DATA_DIR}/data/media/gif:/usr/share/nginx/html/gif:ro
