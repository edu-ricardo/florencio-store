# Compila "A Dark Room" (site estático, sem imagem oficial) como um nginx
# servindo o próprio código do jogo. Resultado: ghcr.io/edu-ricardo/adarkroom:<versão>
name: A Dark Room image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag do A Dark Room"
        required: true
        default: "1.4"
  workflow_call:
    inputs:
      version:
        description: "Tag do A Dark Room"
        required: true
        type: string

env:
  DEFAULT_VERSION: "1.4"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.version || env.DEFAULT_VERSION }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          path: florencio-store

      - uses: actions/checkout@v4
        with:
          repository: doublespeakgames/adarkroom
          ref: ${{ steps.v.outputs.version }}
          path: adarkroom-src

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./adarkroom-src
          file: ./florencio-store/docker/adarkroom.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/edu-ricardo/adarkroom:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/doublespeakgames/adarkroom
            org.opencontainers.image.description=A Dark Room ${{ steps.v.outputs.version }} (static site), served over nginx
            org.opencontainers.image.licenses=MPL-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
