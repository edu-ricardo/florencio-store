# Compila a imagem "coach" da API do openGym (com o Claude Agent SDK e o Codex CLI)
# a partir do código oficial, porque o projeto só publica a imagem padrão e o
# Umbrel não compila imagens. Resultado: ghcr.io/edu-ricardo/opengym-api-coach:<versão>
name: openGym coach image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do openGym (tag sem o v)"
        required: true
        default: "1.3.9"
  push:
    branches: [main]
    paths:
      - .github/workflows/opengym-coach-image.yml

env:
  DEFAULT_VERSION: "1.3.9"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.version || env.DEFAULT_VERSION }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: DuarteSantos8/openGym
          ref: v${{ steps.v.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          target: coach
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/edu-ricardo/opengym-api-coach:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=openGym API (coach target) built from DuarteSantos8/openGym v${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
