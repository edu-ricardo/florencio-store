version: "3.7"

# Rede do host: é o único jeito de o scanner enxergar os aparelhos da sua rede
# (numa rede Docker ele só veria outros containers). Por isso não há app_proxy:
# o painel é servido direto na porta 291 do Umbrel.
services:
  server:
    image: ghcr.io/291-group/lan-orangutan:3.4.2@sha256:5f2ca8cfa4ee7721b021c697f0fcff8672019adb2a7ae1db1f1925d7a71dae08
    restart: on-failure
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      ORANGUTAN_PORT: 291
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/lan-orangutan
