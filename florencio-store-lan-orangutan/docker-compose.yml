version: "3.7"

# Rede do host: é o único jeito de o scanner enxergar os aparelhos da sua rede
# (numa rede Docker ele só veria outros containers). Por isso não há app_proxy:
# o painel é servido direto na porta 291 do Umbrel.
services:
  server:
    image: ghcr.io/291-group/lan-orangutan:4.0.0@sha256:902298992cc69ea6836920727056f6518fa8c0e1c7f07306eafae72afe68f0ab
    restart: on-failure
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      ORANGUTAN_PORT: 291
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/lan-orangutan
