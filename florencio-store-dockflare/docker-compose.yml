version: "3.7"

# Os serviços se chamam pelo nome completo do container porque a rede do Umbrel é
# compartilhada entre apps (nomes curtos como "redis" poderiam apontar para outro app).
services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-dockflare_server_1
      APP_PORT: 5000

  # Acesso limitado à API do Docker (o DockFlare cria e gerencia o container do cloudflared)
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    restart: on-failure
    environment:
      CONTAINERS: 1
      EVENTS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      PING: 1
      INFO: 1
      EXEC: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # A imagem roda como uid 65532; ajusta o dono da pasta de dados antes de subir
  permissions:
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    restart: "no"
    command: ["chown", "-R", "65532:65532", "/app/data"]
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/data

  server:
    image: alplat/dockflare:v3.1.6@sha256:8f097ad817c5ed637e3a0157198b87a7a0685e690bdaaef4fade997b441b2e1b
    restart: on-failure
    depends_on:
      socket-proxy:
        condition: service_started
      permissions:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      TZ: America/Sao_Paulo
      REDIS_URL: redis://florencio-store-dockflare_redis_1:6379/0
      DOCKER_HOST: tcp://florencio-store-dockflare_socket-proxy_1:2375
      INTERNAL_BOOTSTRAP_SECRET: ${APP_SEED}
      # O cloudflared criado pelo DockFlare entra na rede dos apps do Umbrel, então o
      # túnel alcança qualquer app pelo nome do container (ex.: http://jellyfin_server_1:8096)
      CLOUDFLARED_NETWORK_NAME: umbrel_main_network
      TUNNEL_NAME: umbrel-dockflare
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/data

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: on-failure
    command: ["redis-server", "--save", "", "--appendonly", "no"]
