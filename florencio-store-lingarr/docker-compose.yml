version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-lingarr_server_1
      APP_PORT: 9876

  server:
    image: ghcr.io/lingarr-translate/lingarr:1.4.1@sha256:38592c3f6156d519a131aeeda3245f0a7765e7c541b801a7b527b7d731efdfce
    restart: on-failure
    # A imagem roda como root; com o usuário do Umbrel as legendas gravadas ao lado
    # dos vídeos ficam com o mesmo dono dos arquivos do app Files
    user: "1000:1000"
    environment:
      ASPNETCORE_URLS: http://+:9876
      HOME: /tmp
      TZ: America/Sao_Paulo
      # SQLite: sem precisar de um banco MySQL/PostgreSQL separado
      DB_CONNECTION: sqlite
      SQLITE_DB_PATH: local.db
      DB_HANGFIRE_SQLITE_PATH: /app/config/Hangfire.db
      TELEMETRY_ENABLED: "false"
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      # Mesmo caminho /downloads do Radarr e do Sonarr do Umbrel, para os caminhos
      # dos filmes e séries que eles informam baterem com os daqui
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
