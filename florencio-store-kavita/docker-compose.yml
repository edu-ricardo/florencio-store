version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-kavita_server_1
      APP_PORT: 5000
      # O Kavita tem login próprio; sem o login do Umbrel na frente, o OPDS
      # funciona em leitores (KOReader, Panels, Chunky...)
      PROXY_AUTH_ADD: "false"

  server:
    image: jvmilazz0/kavita:0.9.1@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a
    restart: on-failure
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/config:/kavita/config
      # Biblioteca: pasta Downloads do app Files (ex.: /downloads/books, /downloads/manga)
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
