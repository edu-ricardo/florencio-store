version: "2.7.0"
tagline: Ensaio da migração do Vamos Jogar para o PocketBase
icon: https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-vamos-jogar/icon.png
description: >-
  Versão de homologação do Vamos Jogar com banco e login próprios (PocketBase), para
  ensaiar a migração do Firebase sem mexer no app em uso. Acesso pelo Cloudflare Tunnel
  com Cloudflare Access.


  Depois de instalar, preencha data/pocketbase.env e data/api.env em
  ~/umbrel/app-data/florencio-store-vamos-jogar-homolog/ e reinicie o app.
  Imagens disponíveis só para x86 (amd64).
