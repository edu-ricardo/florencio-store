version: "3.7"

# Sem app_proxy: o plugin do Obsidian fala direto com o CouchDB usando o login
# do próprio CouchDB (Basic auth + CORS), que o login do Umbrel bloquearia.
services:
  couchdb:
    image: couchdb:3.5.3@sha256:3611ce43bd32fe2368997fd41ec6e7270ec8d84aa5fc13c9828e5b15fd6bafe8
    restart: on-failure
    ports:
      - 5984:5984
    environment:
      COUCHDB_USER: admin
      # Senha mostrada pelo Umbrel ao abrir o app
      COUCHDB_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/opt/couchdb/data
      # Configurações exigidas pelo LiveSync (CORS, tamanhos, login obrigatório)
      - ${APP_DATA_DIR}/config/livesync.ini:/opt/couchdb/etc/local.d/10-livesync.ini:ro
