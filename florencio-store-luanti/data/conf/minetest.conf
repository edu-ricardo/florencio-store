# Configuração inicial do servidor Luanti. Edite livremente: este arquivo só
# é copiado na instalação, uma atualização do app não sobrescreve as suas
# alterações.
server_name = Meu servidor Luanti
server_description = Servidor no meu Umbrel
port = 30000
# Precisa bater com o id do jogo que você instalar em
# data/world/.minetest/games/ (o minetest_game usa o id "minetest").
default_game = minetest
max_users = 10
creative_mode = false
enable_damage = true
