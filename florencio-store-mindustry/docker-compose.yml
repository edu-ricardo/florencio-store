version: "3.7"

# Sem painel web: o console do servidor é por "docker attach" (veja o
# umbrel-app.yml). Por isso não tem app_proxy; a porta do jogo é publicada
# direto, em TCP e UDP (o Mindustry precisa dos dois na mesma porta).
services:
  server:
    # Imagem compilada por este repositório (não a anderpuqing/mindustry):
    # ela embute um JRE 11 fixo e o Mindustry atual exige Java 17+, dá
    # UnsupportedClassVersionError. Veja .github/workflows/mindustry-image.yml.
    image: ghcr.io/edu-ricardo/mindustry-server:159.7@sha256:ae87955fc2846937620fb1a7ea861d264c31d6fe59cf4c20f8aea03b055a4315
    restart: on-failure
    # Mantém o console aberto para o "docker attach" funcionar
    stdin_open: true
    tty: true
    ports:
      - 6567:6567/tcp
      - 6567:6567/udp
    volumes:
      - ${APP_DATA_DIR}/data/config:/mindustry/config
