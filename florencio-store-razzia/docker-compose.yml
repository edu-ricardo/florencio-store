version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-razzia_server_1
      APP_PORT: 3000
      # A tela de quem participa (sem senha) e a do apresentador (com senha
      # própria do Razzia, veja MANAGER_PASSWORD) ficam na mesma porta.
      PROXY_AUTH_ADD: "false"

  server:
    image: ralex91/razzia:4.0.1@sha256:bab33d1cd29c31e765ea37d36de7fdb33ccfdb5401a4d696b175ac003d3c5b5a
    restart: on-failure
    environment:
      MANAGER_PASSWORD: ${APP_PASSWORD}
      JWT_SECRET: ${APP_SEED}
    volumes:
      # Quizzes (JSON) e resultados; sobrevive a atualizações do app
      - ${APP_DATA_DIR}/data/config:/app/config
