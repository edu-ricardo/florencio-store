releaseNotes: >-
  Duplicados: excluir em lote (PDFs que já têm CBZ, cópias de uma pasta ou
  escolhidos um a um) para uma lixeira da app, com restaurar e esvaziar; nunca
  exclui a última cópia. Metadados: preencher à mão, colar o link da edição no
  ComicVine ou no GCD, e escolher o número quando a fonte só acha a série.
