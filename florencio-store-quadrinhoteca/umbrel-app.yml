releaseNotes: >-
  Metadados (GCD e ComicVine) com confirmação na tela de Tarefas e
  ComicInfo.xml gravado no CBZ; organização de pastas e nomes com prévia e
  desfazer; tela de duplicados; catálogo agrupado pela série identificada.
  As edições que você já tem não são identificadas sozinhas: use
  "Identificar metadados" em Bibliotecas. Pelo GCD sem chave a identificação é
  lenta (poucos pedidos por hora); com a chave do ComicVine é bem mais rápida.
