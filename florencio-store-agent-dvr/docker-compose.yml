version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-agent-dvr_server_1
      APP_PORT: 8090

  server:
    image: ispysoftware/agentdvr:8.1.1.0@sha256:2b4e4fa07cbd53716900455b442e1e5cbfccf60263ef4d5de12925ab546186c1
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
      AGENTDVR_WEBUI_PORT: 8090
    volumes:
      - ${APP_DATA_DIR}/data/config:/AgentDVR/Media/XML
      - ${APP_DATA_DIR}/data/media:/AgentDVR/Media/WebServerRoot/Media
      - ${APP_DATA_DIR}/data/commands:/AgentDVR/Commands
    ports:
      # TURN/WebRTC (streaming ao vivo)
      - 3478:3478/udp
      - 3478:3478/tcp
      - 50000-50010:50000-50010/udp
