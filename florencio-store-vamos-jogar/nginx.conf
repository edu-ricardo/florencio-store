# Cópia do apps/web/nginx.conf do projeto vamos-jogar, montada por cima da da imagem.
# A única diferença é o destino da API: o nome completo do container. A rede do
# Umbrel é compartilhada entre apps, e o nome curto "api" também pertence a
# outros apps (openGym, LocalAI...).
server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS do Docker, resolvido a cada requisição: o nginx sobe mesmo se a API ainda não estiver pronta
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API no mesmo endereço do site: sem CORS e sem URL fixa no build
  location /api/ {
    set $api_upstream http://florencio-store-vamos-jogar_api_1:3001;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos com hash no nome nunca mudam
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker e página inicial sempre revalidados, para o PWA pegar versões novas
  location ~ ^/(sw\.js|workbox-.*\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
  }

  # Rotas do React Router caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
