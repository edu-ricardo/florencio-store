manifestVersion: 1
id: florencio-store-vamos-jogar
category: social
name: Vamos Jogar
version: "2.3.0"
tagline: Organize as jogatinas de tabuleiro com os amigos
icon: https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-vamos-jogar/icon.png
description: >-
  Hub para marcar e organizar encontros de jogos de tabuleiro: grupos com convite,
  votação de data, local e jogos, e a ludoteca de cada participante com dados da
  Ludopedia e do BoardGameGeek. Banco de dados e login (Google) no próprio servidor,
  com PocketBase.


  Antes de instalar ou atualizar, crie data/pocketbase.env e preencha data/api.env em
  ~/umbrel/app-data/florencio-store-vamos-jogar/ (veja o roteiro da virada).
  Imagens disponíveis só para x86 (amd64).
developer: edu-ricardo
website: https://github.com/edu-ricardo/vamos-jogar
submitter: edu-ricardo
submission: https://github.com/edu-ricardo/florencio-store
submissionTermAcceptance: true
repo: https://github.com/edu-ricardo/vamos-jogar
support: https://github.com/edu-ricardo/vamos-jogar/issues
port: 8801
gallery: []
releaseNotes: >-
  Painel de administração (menu Admin): usuários, senha temporária, admins de grupos e
  registro das ações; e Conta → Trocar senha. Antes de atualizar, acrescente ao
  data/api.env a linha APP_ADMIN_EMAILS=seu-email (admins fixos, separados por vírgula).
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
