manifestVersion: 1
id: florencio-store-vamos-jogar
category: social
name: Vamos Jogar
version: "1.0.1-homolog"
tagline: Organize as jogatinas de tabuleiro com os amigos
icon: https://raw.githubusercontent.com/edu-ricardo/florencio-store/main/florencio-store-vamos-jogar/icon.png
description: >-
  Hub para marcar e organizar encontros de jogos de tabuleiro: grupos com convite,
  votação de data, local e jogos, e a ludoteca de cada participante com dados da
  Ludopedia e do BoardGameGeek. Nesta versão o login e o banco de dados ainda
  ficam no Firebase.


  Depois de instalar, copie o .json da conta de serviço do Firebase para
  ~/umbrel/app-data/florencio-store-vamos-jogar/data/firebase-service-account.json,
  preencha data/api.env na mesma pasta e reinicie o app.
  Imagens disponíveis só para x86 (amd64).
developer: edu-ricardo
website: https://github.com/edu-ricardo/vamos-jogar
submitter: edu-ricardo
submission: https://github.com/edu-ricardo/florencio-store
submissionTermAcceptance: true
repo: https://github.com/edu-ricardo/vamos-jogar
support: https://github.com/edu-ricardo/vamos-jogar/issues
port: 8801
gallery: []
releaseNotes: >-
  Credencial do Firebase passa a ser um arquivo em data/firebase-service-account.json
  (não é mais preciso colar o JSON no api.env). Corrige a busca de jogos indo para
  o container de outro app e adiciona limite de tempo nas APIs da Ludopedia e do BGG.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
