version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-vamos-jogar_web_1
      APP_PORT: 80
      # O app tem login próprio; com o login do Umbrel os amigos não conseguiriam entrar
      PROXY_AUTH_ADD: "false"

  web:
    # Imagens publicadas só para amd64 (x86)
    image: ghcr.io/edu-ricardo/vamos-jogar-web:2.6.0@sha256:4051a6bf39545328134ef952708859913bc7fa8dbc7e3fc035abf713676d20aa
    restart: on-failure
    depends_on:
      - api
      - pocketbase
    environment:
      # Nomes completos: nomes curtos como "api" também existem em outros apps na rede do Umbrel
      API_UPSTREAM: florencio-store-vamos-jogar_api_1:3001
      PB_UPSTREAM: florencio-store-vamos-jogar_pocketbase_1:8090

  api:
    image: ghcr.io/edu-ricardo/vamos-jogar-api:2.6.0@sha256:d2f27d06fd99d86169172a77562cb105d119fbc33ff1b0a91f4a256f6542dd75
    restart: on-failure
    depends_on:
      - pocketbase
    # Segredos ficam no Umbrel, fora da loja: ~/umbrel/app-data/florencio-store-vamos-jogar/data/
    env_file:
      - ${APP_DATA_DIR}/data/api.env
    environment:
      PB_URL: http://florencio-store-vamos-jogar_pocketbase_1:8090
    volumes:
      # Backup do Firebase para a importação (somente leitura)
      - ${APP_DATA_DIR}/data/backup:/backup:ro

  pocketbase:
    image: ghcr.io/edu-ricardo/vamos-jogar-pocketbase:2.6.0@sha256:e63512966edf57d2d76a54ac48c7a9360e9a34c18d106c839679c43a79af0d18
    restart: on-failure
    # Precisa existir antes da atualização (criado por SSH no roteiro da virada)
    env_file:
      - ${APP_DATA_DIR}/data/pocketbase.env
    volumes:
      # Banco de dados do app, com backups automáticos em pb_data/backups
      - ${APP_DATA_DIR}/data/pb_data:/pb_data
