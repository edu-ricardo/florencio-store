version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-vamos-jogar_web_1
      APP_PORT: 80
      # O app tem login próprio; com o login do Umbrel os amigos não conseguiriam entrar
      PROXY_AUTH_ADD: "false"

  web:
    # Imagens publicadas só para amd64 (x86)
    image: ghcr.io/edu-ricardo/vamos-jogar-web:1.0.1-homolog@sha256:ee9cc33a4217376f2b003e17c576ba535a7351d83a89591ac00400f847a49d48
    restart: on-failure
    depends_on:
      - api
    environment:
      # Nome completo do container: o nome curto "api" também é usado por outros apps na rede do Umbrel
      API_UPSTREAM: florencio-store-vamos-jogar_api_1:3001

  api:
    image: ghcr.io/edu-ricardo/vamos-jogar-api:1.0.1-homolog@sha256:75343968088b48674a36342eb048afdcd73ee8ce820aca9710f3e20df0aead6f
    restart: on-failure
    # Segredos ficam no Umbrel, fora da loja: ~/umbrel/app-data/florencio-store-vamos-jogar/data/
    env_file:
      - ${APP_DATA_DIR}/data/api.env
    environment:
      # Arquivo .json da conta de serviço do Firebase, copiado para a pasta data do app
      GOOGLE_APPLICATION_CREDENTIALS: /data/firebase-service-account.json
    volumes:
      - ${APP_DATA_DIR}/data:/data:ro
