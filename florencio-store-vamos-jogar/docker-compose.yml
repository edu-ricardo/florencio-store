version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:v0.2.0
    restart: on-failure
    environment:
      APP_HOST: web
      APP_PORT: 80
      # O app tem login próprio; com o login do Umbrel os amigos não conseguiriam entrar
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/edu-ricardo/vamos-jogar-web:1.0.0-homolog
    restart: on-failure
    depends_on:
      - api

  api:
    image: ghcr.io/edu-ricardo/vamos-jogar-api:1.0.0-homolog
    restart: on-failure
    # Segredos ficam no Umbrel, fora da loja: ~/umbrel/app-data/florencio-store-vamos-jogar/data/api.env
    env_file:
      - ${APP_DATA_DIR}/data/api.env
