version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-jellydash_app_1
      APP_PORT: 80

  app:
    image: ghcr.io/themartz90/jellydash:1.15.1@sha256:92d6c5bea51434f70f1f5bf797dd5c5f4f12a77cbc7419e836dc8da31329eebc
    restart: on-failure
    # URL/token do Jellyfin e opções ficam neste arquivo (editável pelo usuário)
    env_file:
      - ${APP_DATA_DIR}/data/jellydash.env
    environment:
      APP_ENV: production
      APP_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      # SQLite: sem precisar de um banco MariaDB separado
      DB_DRIVER: sqlite3
      DB_NAME: /var/www/html/var/data/jellydash.sqlite
    volumes:
      - ${APP_DATA_DIR}/data/sqlite:/var/www/html/var/data
      - ${APP_DATA_DIR}/data/cache:/var/www/html/cache
      - ${APP_DATA_DIR}/data/runtime-cache:/var/www/html/var/cache
      - ${APP_DATA_DIR}/data/log:/var/www/html/var/log
      - ${APP_DATA_DIR}/data/sessions:/var/www/html/var/sessions
      - ${APP_DATA_DIR}/data/uploads:/var/www/html/public/uploads
