version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-listenarr_server_1
      APP_PORT: 4545
      # Libera a API para integrações (Prowlarr, clientes de download etc.)
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/listenarrs/listenarr:canary-1.6.3@sha256:265d4fd8f8242079a6620257dda018d022f053fa7f1d512c5dcbc5c880c3e85d
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: "022"
      TZ: America/Sao_Paulo
      LISTENARR_LOG_LEVEL: Information
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      # Mesmo caminho /downloads usado pelo Transmission/qBittorrent do Umbrel,
      # assim não é preciso configurar "remote path mapping".
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
