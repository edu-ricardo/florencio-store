version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-filebrowser-quantum_server_1
      APP_PORT: 80

  server:
    # Versão estável 2.x (as tags "-beta" são pré-lançamentos)
    image: gtstef/filebrowser:2.0.2-stable@sha256:de2b4c4d18485ea202ab2cdada5bd25d8f0b8ed071712c8216a67194c31285ae
    restart: on-failure
    # Mesmo usuário do Umbrel: o que for criado ou enviado fica com o dono certo no app Files
    user: "1000:1000"
    environment:
      TZ: America/Sao_Paulo
      # Senha do admin = a senha que o Umbrel mostra ao abrir o app
      FILEBROWSER_ADMIN_PASSWORD: ${APP_PASSWORD}
      # A imagem procura o config.yaml dentro de /home/filebrowser/data; como essa pasta
      # é montada vazia (banco), a configuração é montada de fora. O config.yaml é
      # gerado pelo umbrelOS a partir do config.yaml.template (atualizado junto com o app)
      FILEBROWSER_CONFIG: /config/config.yaml
      FILEBROWSER_DATABASE_PATH: /home/filebrowser/data/database.sqlite
    volumes:
      - ${APP_DATA_DIR}/config.yaml:/config/config.yaml:ro
      - ${APP_DATA_DIR}/data:/home/filebrowser/data
      # Arquivos do Umbrel (app Files)
      - ${UMBREL_ROOT}/data/storage:/srv
