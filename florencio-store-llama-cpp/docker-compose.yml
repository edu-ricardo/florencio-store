version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-llama-cpp_server_1
      APP_PORT: 8080

  server:
    # Variante Vulkan, não CUDA: a imagem CUDA exige driver NVIDIA >= 570
    # (CUDA 12.8); pela rede de muitos Umbrels ter driver mais antigo, o
    # Vulkan usa o driver que já existir (mesmo dispositivo /dev/dri da
    # permissão GPU), sem essa exigência de versão.
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11610@sha256:d64043576ad8fb29170563c769a997dbc1b9928f0d4a127fb9e4a9706ccb475b
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # Sem isso o nvidia-container-runtime só libera "compute,utility"
      # (o padrão): dá para CUDA, mas não inclui as bibliotecas de Vulkan, e
      # o modelo acaba carregando na CPU mesmo com a GPU presente.
      NVIDIA_DRIVER_CAPABILITIES: all
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      # Modo roteador: serve todos os .gguf da pasta de modelos e carrega sob demanda
      LLAMA_ARG_MODELS_DIR: /models
      # GTX 1650 (4 GB): um modelo por vez, tudo na GPU, contexto moderado
      LLAMA_ARG_MODELS_MAX: 1
      LLAMA_ARG_N_GPU_LAYERS: 999
      LLAMA_ARG_CTX_SIZE: 8192
    volumes:
      # Coloque os arquivos .gguf em Downloads/llama.cpp (app Files)
      - ${UMBREL_ROOT}/data/storage/downloads/llama.cpp:/models
