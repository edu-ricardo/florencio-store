version: "3.7"

services:
  app_proxy:
    environment:
      # Formato obrigatório: <app-id>_<nome-do-serviço>_1
      APP_HOST: florencio-store-mylar3_server_1
      APP_PORT: 8090
      # Libera a API (/api?apikey=...&cmd=...) para o Prowlarr e outros apps
      PROXY_AUTH_WHITELIST: "/api,/api/*"

  server:
    image: linuxserver/mylar3:2021.12.13@sha256:64f398b4f1b9be85195ae792ca2e5fe05802352f8ea81f8ab5fa1ff725ca902a
    restart: on-failure
    # Imagem linuxserver: sem "user:" (o s6-overlay começa como root e troca
    # para PUID/PGID).
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
    volumes:
      # Configuração, banco e cache
      - ${APP_DATA_DIR}/data/config:/config
      # Mesmo caminho /downloads usado pelo Transmission/qBittorrent do Umbrel
      # e pelo Kavita: pasta de quadrinhos sugerida /downloads/comics
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
